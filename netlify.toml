[[plugins]]
  package = "netlify-plugin-minify-html"

  [plugins.inputs]
    contexts = ["production"]

    [plugins.inputs.minifierOptions]
      removeAttributeQuotes     = false
      collapseWhitespace        = true
      removeComments            = true
      minifyCSS                 = true
      minifyJS                  = true
      sortAttributes            = false
      sortClassName             = false
      removeRedundantAttributes = false
      # preventAttributesEscaping KALDIRILDI — onclick icindeki tek tirnaklari
      # cift tirnaga cevirip menuyu kiriyordu (03.08.2026)

[build.processing.html]
  pretty_urls = false
